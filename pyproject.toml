[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "marketlens-ai"
version = "0.1.0"
description = "Chinese-first product feedback analysis with LangGraph and GLiNER2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
marketlens = "marketlens.cli:main"

[project.optional-dependencies]
workflow = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4"]
llm = ["langchain-openai>=1.0,<2"]
nlp = ["gliner2[local]>=2.0,<3"]
ui = ["streamlit>=1.40,<2", "altair>=5,<7"]
collector = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not model_smoke and not live_api'"
markers = [
    "model_smoke: explicitly load a real local model (may download weights)",
    "live_api: explicitly access an external service (requires credentials)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
